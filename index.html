<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greek Alphabet Trainer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>Ω</text></svg>">
  <script>
    // Applied before first paint so a light-theme visitor never sees a dark flash.
    // Mirrors src/theme.js; that module remains the single source of truth.
    try {
      var t = localStorage.getItem('greek-alphabet-theme');
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <button id="theme" class="theme-toggle" type="button" aria-label="Switch between dark and light"></button>

  <main>
    <!-- Idle -->
    <section id="screen-idle" class="screen">
      <h1>Greek Alphabet</h1>
      <button id="play" class="play">Play</button>
      <p id="idle-progress" class="progress-line"></p>
    </section>

    <!-- Card -->
    <section id="screen-card" class="screen" hidden>
      <p id="card-counter" class="counter"></p>
      <div id="glyph" class="glyph"></div>
      <div id="options" class="options"></div>
    </section>

    <!-- Summary -->
    <section id="screen-summary" class="screen" hidden>
      <p id="summary-score" class="score"></p>
      <p id="summary-missed" class="missed"></p>
      <button id="continue" class="play secondary">Next round</button>
    </section>

    <!-- Done -->
    <section id="screen-done" class="screen" hidden>
      <div class="glyph done-glyph">Ω</div>
      <h1>Done</h1>
      <p id="done-stats" class="progress-line"></p>
    </section>

    <!-- Alphabet table -->
    <section id="screen-table" class="screen" hidden>
      <h1>Alphabet</h1>
      <table class="table">
        <thead>
          <tr><th scope="col">Capital</th><th scope="col">Small</th><th scope="col">Name</th></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <button id="table-back" class="play secondary">Back</button>
    </section>

    <!-- Ordering drill -->
    <section id="screen-order" class="screen" hidden>
      <h1>Order</h1>
      <p id="order-counter" class="counter"></p>
      <div id="tiles" class="tiles"></div>
      <div class="row">
        <button id="order-again" class="play secondary">Shuffle</button>
        <button id="order-back" class="play secondary">Back</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="links">
      <button id="alphabet" class="link">Alphabet</button>
      <button id="order" class="link">Order</button>
      <button id="reset" class="link">Reset progress</button>
    </div>
    <div id="progress-bar" class="bar" role="progressbar" aria-label="Letters mastered"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-fill" class="bar-fill"></div>
    </div>
  </footer>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
